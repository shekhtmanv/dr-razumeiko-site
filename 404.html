<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Сторінку не знайдено (404) | Катерина Разумейко</title>
    <meta name="description" content="Сторінку не знайдено. Поверніться на головну сторінку сайту лікаря-онкодерматолога Катерини Разумейко у Києві.">
    <meta name="robots" content="noindex, follow">
    
    <!-- Канонічна адреса -->
    <link rel="canonical" href="https://dr-razumeiko.com/404">

    <!-- Фірмовий фавікон -->
    <link rel="icon" type="image/svg+xml" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'><rect x='15.2' y='2' width='1.6' height='28' rx='0.8' fill='%236B5B52'/><rect x='13' y='14.5' width='6' height='1.6' rx='0.8' fill='%236B5B52'/><path d='M5 8h2v7.2l5.2-7.2h2.4l-5.8 7.8L15 24h-2.4l-5-7.5V24H5V8z' fill='%236B5B52'/><path d='M19 8h5.2c2.1 0 3.8 1.4 3.8 3.4 0 1.4-.9 2.6-2.2 3.1 1.6.5 2.6 1.8 2.6 3.5 0 2.1-1.7 3.5-4 3.5H19V8zm2 5.2h3.2c1 0 1.8-.7 1.8-1.6s-.8-1.6-1.8-1.6H21v3.2zm0 5.4h3.5c1.1 0 2-.8 2-1.8s-.9-1.8-2-1.8H21v3.6z' fill='%236B5B52'/></svg>">

    <!-- Скрипт перенаправлення для SPA-роутингу -->
    <script>
        // Зберігаємо шлях, який намагався відкрити користувач, та перенаправляємо на головну
        const currentPath = window.location.pathname + window.location.search + window.location.hash;
        sessionStorage.setItem('redirectPath', currentPath);
        window.location.replace('/');
    </script>

    <style>
        :root {
            --primary-color: #0f2c59;
            --accent-color: #1a5f7a;
            --text-color: #2d3748;
            --bg-light: #f8fafc;
            --white: #ffffff;
            --border-color: #e2e8f0;
            --shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        body {
            background-color: var(--bg-light);
            color: var(--text-color);
            display: flex;
            flex-direction: column;
            min-height: 100vh;
            justify-content: center;
            align-items: center;
            text-align: center;
            padding: 2rem;
        }

        .error-card {
            background: var(--white);
            padding: 3rem 2rem;
            border-radius: 20px;
            box-shadow: var(--shadow);
            border: 1px solid var(--border-color);
            max-width: 500px;
            width: 100%;
        }

        h1 {
            color: var(--primary-color);
            font-size: 3rem;
            margin-bottom: 0.5rem;
            font-weight: 800;
        }

        h2 {
            color: var(--primary-color);
            font-size: 1.5rem;
            margin-bottom: 1rem;
        }

        p {
            color: #4a5568;
            margin-bottom: 2rem;
            line-height: 1.6;
        }

        .btn-cta {
            background: var(--primary-color);
            color: var(--white);
            padding: 0.75rem 1.8rem;
            border-radius: 50px;
            text-decoration: none;
            font-weight: 600;
            transition: all 0.3s ease;
            box-shadow: 0 4px 12px rgba(15, 44, 89, 0.2);
            display: inline-block;
        }

        .btn-cta:hover {
            background: var(--accent-color);
            transform: translateY(-2px);
        }
    </style>
</head>
<body>
    <div class="error-card">
        <h1>404</h1>
        <h2>Сторінку не знайдено</h2>
        <p>Схоже, цієї сторінки не існує або вона була переміщена. Зараз ми автоматично перенаправимо вас на головну.</p>
        <a href="/" class="btn-cta">На головну сторінку</a>
    </div>
</body>
</html>
